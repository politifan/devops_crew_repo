name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests/ -q
      - run: python -m ruff check .
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker build -t portfolio-check .
      - name: Run container and verify health
        run: |
          docker run -d --name portfolio-check -p 127.0.0.1:8000:8000 portfolio-check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs portfolio-check
          exit 1
      - name: Clean up
        if: always()
        run: docker rm -f portfolio-check || true
