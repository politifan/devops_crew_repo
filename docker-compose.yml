services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: docker
      APP_VERSION: 0.1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
